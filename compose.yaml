# The full stack: Postgres, one API instance, a pool of workers from the same image, and
# Prometheus + Grafana scraping all of them.
#
#   Admin UI    http://localhost:8080
#   Grafana     http://localhost:3000   (anonymous read-only access; local use only)
#   Prometheus  http://localhost:9090
#
#   docker compose up --build              # 3 workers
#   docker compose up --build --scale worker=5
#   docker compose up postgres             # database only, for running the app from an IDE
#
# Heartbeat settings are shortened so the crash-recovery demo in the README takes seconds;
# the application defaults (5s / 30s / 10s) are more conservative.
x-app: &app
  build: .
  image: task-scheduler:local
  depends_on:
    postgres:
      condition: service_healthy
  environment: &app-env
    DB_URL: jdbc:postgresql://postgres:5432/scheduler
    DB_USER: scheduler
    DB_PASSWORD: scheduler
    # Fleet-wide heartbeat settings. The API reads the timeout too, to report it to the UI.
    SCHEDULER_WORKER_HEARTBEAT_INTERVAL: 2s
    SCHEDULER_WORKER_HEARTBEAT_TIMEOUT: 10s
    SCHEDULER_WORKER_REAPER_INTERVAL: 3s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    <<: *app
    environment:
      <<: *app-env
      SCHEDULER_API_ENABLED: "true"
      SCHEDULER_WORKER_ENABLED: "false"
    ports:
      - "8080:8080"

  worker:
    <<: *app
    environment:
      <<: *app-env
      SCHEDULER_API_ENABLED: "false"
      SCHEDULER_WORKER_ENABLED: "true"
      SCHEDULER_WORKER_CONCURRENCY: "10"
    deploy:
      replicas: 3
    # Longer than scheduler.worker.shutdown-grace (30s), so in-flight jobs can drain or be released.
    stop_grace_period: 40s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      # Anonymous, read-only access so the demo needs no login. Fine for a stack that only
      # runs on a laptop; never expose this configuration on a network.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/task-scheduler.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
