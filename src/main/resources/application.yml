spring:
  application:
    name: task-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

scheduler:
  api:
    enabled: true
  worker:
    enabled: true
    concurrency: 10
    poll-interval: 1s
    shutdown-grace: 30s
    retry:
      base-delay: 5s
      max-delay: 1h
