spring:
  application:
    name: task-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
  threads:
    virtual:
      enabled: true
  lifecycle:
    # Must exceed scheduler.worker.shutdown-grace: otherwise Spring gives up on the worker's
    # stop() and closes the connection pool before unfinished jobs can be released.
    timeout-per-shutdown-phase: 45s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

scheduler:
  api:
    enabled: true
  worker:
    enabled: true
    concurrency: 10
    poll-interval: 1s
    shutdown-grace: 30s
    heartbeat-interval: 5s
    heartbeat-timeout: 30s
    reaper-interval: 10s
    retry:
      base-delay: 5s
      max-delay: 1h
  schedule:
    poll-interval: 1s
  metrics:
    refresh-interval: 5s
  demo-handlers:
    enabled: true
