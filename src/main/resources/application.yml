spring:
  application:
    name: task-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
  threads:
    virtual:
      enabled: true
  lifecycle:
    # Must exceed scheduler.worker.shutdown-grace: otherwise Spring gives up on the worker's
    # stop() and closes the connection pool before unfinished jobs can be released.
    timeout-per-shutdown-phase: 45s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      # Docker sets HOSTNAME to the container id, which is also what workers register as their
      # hostname, so Grafana's per-worker series line up with the admin UI and `docker kill`.
      host: ${HOSTNAME:local}
    distribution:
      # Publish histogram buckets, not just client-side percentiles: percentiles cannot be
      # combined across workers, buckets can (Grafana uses histogram_quantile over their sum).
      percentiles-histogram:
        "[job.queue.wait]": true
        "[job.execution.duration]": true
      maximum-expected-value:
        "[job.queue.wait]": 10m
        "[job.execution.duration]": 10m

scheduler:
  api:
    enabled: true
  worker:
    enabled: true
    concurrency: 10
    poll-interval: 1s
    shutdown-grace: 30s
    heartbeat-interval: 5s
    heartbeat-timeout: 30s
    reaper-interval: 10s
    retry:
      base-delay: 5s
      max-delay: 1h
  schedule:
    poll-interval: 1s
  metrics:
    refresh-interval: 5s
  demo-handlers:
    enabled: true
