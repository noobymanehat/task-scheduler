# Scrapes the API and every worker replica. Worker replicas are found through Compose's DNS:
# the service name `worker` resolves to one A record per running container, so
# `docker compose up --scale worker=5` needs no change here, and a killed container drops out
# of the target list on the next refresh.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]

  - job_name: worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8080
        refresh_interval: 5s
